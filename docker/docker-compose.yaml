services:
  postgres:
    image: postgres:16-alpine
    container_name: mockbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mockbank
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockbank"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bank-api:
    build:
      context: ..
      dockerfile: docker/bank-api/Dockerfile
    container_name: mockbank-api
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh", "air", "-c", ".air.toml"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mockbank
      DB_SSLMODE: disable
      PORT: 8080
      # The compose stack is a demo environment: keep the deliberately flaky
      # bank behavior explicit. Production defaults are off.
      CHAOS_ENABLED: "true"
      FAILURE_RATE: 0.05
      MIN_LATENCY_MS: 100
      MAX_LATENCY_MS: 2000
      AUTH_EXPIRY_HOURS: 168
      # API key authentication is on by default. The demo stack pins a stable
      # bootstrap key so restarts and recreated volumes keep the same
      # credential. Change this value outside local demos.
      AUTH_ENABLED: "true"
      AUTH_BOOTSTRAP_KEY: "bk_demo_bootstrap_key_change_me"
      AUTH_BOOTSTRAP_MERCHANT: "default"
      # Per-key token buckets. Zero means unlimited for keys without their own
      # limit; the demo keeps the default so throttling is visible.
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_DEFAULT_PER_MINUTE: 120
      LOG_LEVEL: debug
    ports:
      - "8787:8080"
    volumes:
      - ../backend:/app
      - air_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bank-network:
    driver: bridge
    name: mockbank-network

volumes:
  postgres_data:
    name: mockbank-postgres-data
  air_tmp:
    name: mockbank-air-tmp
